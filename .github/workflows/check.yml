name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pvarki/config-ci-library/.github/actions/setup-python@1786399bf62c2b691f1e8fb9dcfc7a0be72a2846
        with:
          python-version: "3.14"
          uv-version: "0.12.13"
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task --list
      - run: task check
      - run: uv run --locked prek run --all-files
        # Branch protection guards local commits, not validation after a push to main.
        env:
          SKIP: no-commit-to-branch
      - run: task build

  snyk:
    # Disabled until the new organization is configured. This is not a passed scan.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Snyk is disabled."
