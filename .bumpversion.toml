[tool.bumpversion]
current_version = "0.1.0+261011"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)\\+(?P<build>\\d+)"
serialize = ["{major}.{minor}.{patch}+{build}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
commit = false
allow_dirty = false

[tool.bumpversion.parts.build]
calver_format = "{0Y}{0M}{0D}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"opendefence-integration-mediamtx\"\nversion = \"{current_version}\""
replace = "name = \"opendefence-integration-mediamtx\"\nversion = \"{new_version}\""

# OCI tags use a hyphen in place of the Python build separator.
[[tool.bumpversion.files]]
filename = "zarf.yaml"
search = "version: {current_major}.{current_minor}.{current_patch}-{current_build}"
replace = "version: {new_major}.{new_minor}.{new_patch}-{new_build}"

[[tool.bumpversion.files]]
filename = "zarf.yaml"
search = "zarf.internal/opendefence/integration-mediamtx:{current_major}.{current_minor}.{current_patch}-{current_build}"
replace = "zarf.internal/opendefence/integration-mediamtx:{new_major}.{new_minor}.{new_patch}-{new_build}"
