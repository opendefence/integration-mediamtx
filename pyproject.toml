[project]
name = "odintegration_mediamtx"
version = "0.1.0"
description = "OpenDefence MediaMTX integration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cloudcoil[kubernetes,operator]",
]

[dependency-groups]
dev = [
    "cloudcoil[test]",
    "pytest>=9.1.1,<10.0",
    "coverage>=7.16.0,<8.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.7,<1.0",
    "bandit>=1.9.4,<2.0",
    "pyrefly>=1.3.0,<2.0",
    "prek>=0.5.2,<1.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "bump-my-version>=1.5.1,<2.0",
    "detect-secrets>=1.5.0,<2.0",
    "types-pyyaml>=6.0.12,<7.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PL"]
ignore = ["PLR2004"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "spikes"]
search-path = ["src", "."]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
# Use this repository's owned Kind workflow, not Cloudcoil's optional cluster plugin.
addopts = "-p no:cloudcoil"

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odintegration_mediamtx"]

[tool.hatch.metadata]
allow-direct-references = true
