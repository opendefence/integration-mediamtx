[project]
name = "odintegration_mediamtx"
version = "0.1.0"
description = "OpenDefence MediaMTX integration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cloudcoil @ git+https://github.com/cloudcoil/cloudcoil.git@e8ec4ef00c03b2c8974ed7ed0c99a7280ee802c8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "ruff>=0.16.7,<1.0",
    "pyrefly>=1.3.0,<2.0",
    "prek>=0.5.2,<1.0",
    "types-pyyaml>=6.0.12,<7.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PL"]
ignore = ["PLR2004"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "spikes"]
search-path = ["src", "."]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
# Use this repository's owned Kind workflow, not Cloudcoil's optional cluster plugin.
addopts = "-p no:cloudcoil"

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odintegration_mediamtx"]

[tool.hatch.metadata]
allow-direct-references = true
